<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda Ubisoft</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      color: #fff;
      background: url('https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3FYr0BWQBNMOtsszigyDo4/b059325673b4a0d2809eae94c9b74053/tctd2-meta_images_default-960x540.jpg') no-repeat center center fixed;
      background-size: cover;
      animation: cambiarFondo 20s infinite ease-in-out;
    }

    @keyframes cambiarFondo {
      0%, 100% {
        background-image: url('https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3FYr0BWQBNMOtsszigyDo4/b059325673b4a0d2809eae94c9b74053/tctd2-meta_images_default-960x540.jpg');
      }
      25% {
        background-image: url('https://image.api.playstation.com/cdn/UP0001/CUSA02902_00/LmixBxp3eIPxu3vc1y4Bxx3UIc3l6rzx.png');
      }
      50% {
        background-image: url('https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3MN69tPhVvfQzmLFJqRlTx/2049f84c25cc4aea843892f7ddd34a31/RKB2_UCS21580_KEYART_wide_RGB-LOGO-V1.jpg');
      }
      75% {
        background-image: url('https://image.api.playstation.com/vulcan/ap/rnd/202404/1815/898047ecfdb7ee9d5cb511b9f293e1ad1f7df0793626b4a6.jpg');
      }
    }

    header {
      background-color: rgba(0, 0, 0, 0.8);
      padding: 1rem;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
    }

    .card {
      background-color: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      width: 250px;
      transition: transform 0.3s ease;
      position: relative;
    }

    /* Quitar animación de volteo */
    .card:hover {
      transform: none;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .info {
      padding: 1rem;
    }

    .info h2 {
      font-size: 1.2rem;
    }

    .price {
      color: #66c0f4;
      margin-bottom: 1rem;
    }

    button {
      padding: 0.5rem;
      width: 100%;
      background: #66c0f4;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      color: #000;
      font-weight: bold;
    }

    .carrito {
      background-color: rgba(0, 0, 0, 0.85);
      max-width: 700px;
      margin: 20px auto;
      border-radius: 10px;
      padding: 1rem;
    }

    .carrito h3 {
      margin-top: 0;
      text-align: center;
    }

    .carrito-list {
      list-style: none;
      padding: 0;
      max-height: 250px;
      overflow-y: auto;
    }

    .carrito-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding: 0.5rem 0;
    }

    .carrito-list button {
      width: auto;
      padding: 0.2rem 0.5rem;
      font-size: 0.9rem;
      background: #f44336;
      color: white;
      border-radius: 5px;
    }

    iframe {
      width: 100%;
      height: 200px;
      border: none;
      margin-top: 0.5rem;
    }

    .social {
      margin-top: 2rem;
      text-align: center;
    }

    .social a {
      margin: 0 10px;
      color: white;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ubisoft Game Store</h1>
  </header>

  <section class="products" id="product-container"></section>

  <div class="carrito">
    <h3>Carrito (<span id="cantidad-juegos">0</span> juegos) - Total: S/<span id="total-carrito">0.00</span></h3>
    <ul class="carrito-list" id="carrito-list"></ul>
  </div>

  <div class="social">
    <a href="https://www.facebook.com/ubisoft" target="_blank"><i class="fab fa-facebook"></i></a>
    <a href="https://twitter.com/Ubisoft" target="_blank"><i class="fab fa-twitter"></i></a>
    <a href="https://www.instagram.com/ubisoft/" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://www.youtube.com/user/ubisoft" target="_blank"><i class="fab fa-youtube"></i></a>
  </div>

  <script>
    const products = [
      {
        name: "Tom Clancy's The Division 2",
        price: 14.99,
        trailer: "https://www.youtube.com/embed/TCfpB8P-qRs",
        img: "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3FYr0BWQBNMOtsszigyDo4/b059325673b4a0d2809eae94c9b74053/tctd2-meta_images_default-960x540.jpg"
      },
      {
        name: "Tom Clancy's Ghost Recon",
        price: 10.99,
        trailer: "https://www.youtube.com/embed/pCCNALJ1fOQ",
        img: "https://image.api.playstation.com/cdn/UP0001/CUSA02902_00/LmixBxp3eIPxu3vc1y4Bxx3UIc3l6rzx.png"
      },
      {
        name: "Mario + Rabbids: Sparks of Hope",
        price: 24.99,
        trailer: "https://www.youtube.com/embed/VEAusFKB368",
        img: "https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3MN69tPhVvfQzmLFJqRlTx/2049f84c25cc4aea843892f7ddd34a31/RKB2_UCS21580_KEYART_wide_RGB-LOGO-V1.jpg"
      },
      {
        name: "Assassin's Creed Shadows",
        price: 59.99,
        trailer: "https://www.youtube.com/embed/vovkzbtYBC8",
        img: "https://image.api.playstation.com/vulcan/ap/rnd/202404/1815/898047ecfdb7ee9d5cb511b9f293e1ad1f7df0793626b4a6.jpg"
      },
      {
        name: "Tom Clancy's The Division",
        price: 12.99,
        trailer: "https://www.youtube.com/embed/uElsBflqgYw",
        img: "https://image.api.playstation.com/cdn/UP0001/CUSA01810_00/vczGPhQbzd4qFQW1Ym9SBRFRrThzKulf.png"
      }
    ];

    let cart = [];

    function cargarProductos() {
      const contenedor = document.getElementById("product-container");
      products.forEach((product, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${product.img}" alt="${product.name}">
          <div class="info">
            <h2>${product.name}</h2>
            <p class="price">S/${(product.price * 3.75).toFixed(2)}</p>
            <button onclick='addToCart(${index})'>Agregar al carrito</button>
            <iframe src="${product.trailer}" allowfullscreen></iframe>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    function addToCart(index) {
      cart.push(products[index]);
      actualizarCarrito();
      alert(`Agregaste "${products[index].name}" al carrito.`);
    }

    function eliminarDelCarrito(i) {
      cart.splice(i, 1);
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const lista = document.getElementById("carrito-list");
      lista.innerHTML = "";

      cart.forEach((item, i) => {
        const precioSoles = (item.price * 3.75).toFixed(2);
        const li = document.createElement("li");
        li.innerHTML = `
          ${item.name} - S/${precioSoles} 
          <button onclick="eliminarDelCarrito(${i})">Eliminar</button>
        `;
        lista.appendChild(li);
      });

      document.getElementById("cantidad-juegos").textContent = cart.length;
      const total = cart.reduce((sum, item) => sum + item.price * 3.75, 0);
      document.getElementById("total-carrito").textContent = total.toFixed(2);
    }

    cargarProductos();
  </script>
</body>
</html>
